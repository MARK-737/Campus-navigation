<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Campus Navigation</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="loading-overlay">
    <div id="loading-box">
      <p>Loading campus data...</p>
    </div>
  </div>

  <div id="panel">
    <div id="mode-toggle">
      <button id="walk-btn" class="mode-btn active">Walking</button>
      <button id="drive-btn" class="mode-btn">Driving</button>
    </div>

    <!-- REMOVED: origin-select dropdown — geolocation is now the primary
         way to set the starting point, so a manual "From" picker is
         redundant. Users can still click a building directly as a
         fallback if GPS isn't available. -->

    <button id="locate-btn" disabled>📍 Use My Location as Start</button>

    <label for="dest-select">To</label>
    <select id="dest-select" disabled>
      <option value="">-- Select a building --</option>
    </select>

    <p id="status">Loading campus data, please wait...</p>
    <p id="route-summary"></p>
    <ol id="route-steps"></ol>

    <!-- REMOVED: layer-toggles ("Show on map") and legend sections,
         per request — simplifying the panel to its core function. -->

    <button id="reset-btn">Reset</button>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
